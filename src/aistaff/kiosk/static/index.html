<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gọi món</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="avatar" aria-hidden="true">AI</div>
    <div>
      <div class="store" id="storeName">Đang tải…</div>
      <div class="sub" id="assistantName">Nhân viên AI</div>
    </div>
  </div>
  <div class="ticker" id="promoTicker" aria-live="polite"></div>
  <button class="ghost" id="btnRestart" title="Khách mới">Khách mới</button>
</header>

<main class="layout">
  <section class="assistant" aria-label="Trò chuyện với nhân viên AI">
    <div class="chat" id="chat" role="log" aria-live="polite"></div>
    <div class="options" id="options"></div>
    <div class="chips" id="chips"></div>
    <div class="composer">
      <button class="mic" id="btnMic" aria-label="Bấm để nói">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12z"/></svg>
      </button>
      <form id="form" class="input">
        <input id="text" autocomplete="off" placeholder="Nói hoặc gõ: “cho tôi 2 phở bò tái”, “gợi ý món cay”…">
        <button type="submit">Gửi</button>
      </form>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="menu" aria-label="Thực đơn">
    <nav class="tabs" id="tabs"></nav>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="cart" aria-label="Đơn hàng">
    <h2>Đơn của bạn <span id="cartCount" class="badge">0</span></h2>
    <ul id="cartLines" class="lines"></ul>
    <div class="totals" id="totals"></div>
    <button class="primary" id="btnCheckout" disabled>Chốt đơn</button>
  </aside>
</main>

<div class="overlay" id="welcome">
  <div class="welcome-card">
    <div class="big-avatar">AI</div>
    <h1 id="welcomeTitle">Xin chào!</h1>
    <p>Chạm vào màn hình để gọi món<br>hoặc nói <b>“Xin chào”</b></p>
    <div class="welcome-promos" id="welcomePromos"></div>
    <button class="primary xl" id="btnStart">Bắt đầu gọi món</button>
  </div>
</div>

<div class="overlay hidden" id="payModal" role="dialog" aria-modal="true">
  <div class="pay-card">
    <h2>Quét mã để thanh toán</h2>
    <div class="qr" id="qrBox"></div>
    <div class="amount" id="payAmount"></div>
    <dl class="bank">
      <dt>Ngân hàng</dt><dd id="payBank"></dd>
      <dt>Chủ tài khoản</dt><dd id="payName"></dd>
      <dt>Số tài khoản</dt><dd id="payAcc"></dd>
      <dt>Nội dung</dt><dd id="payCode" class="code"></dd>
    </dl>
    <div class="countdown" id="payCountdown"></div>
    <div class="waiting"><span class="dot"></span> Đang chờ ngân hàng xác nhận…</div>
    <div class="row">
      <button class="ghost" id="btnCash">Trả tiền mặt</button>
      <button class="ghost danger" id="btnCancelPay">Huỷ đơn</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="doneModal" role="dialog" aria-modal="true">
  <div class="done-card">
    <div class="check">✓</div>
    <h2 id="doneTitle">Thanh toán thành công</h2>
    <p id="doneText"></p>
    <div class="order-no" id="doneNo"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
