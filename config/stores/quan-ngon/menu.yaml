# =====================================================================
#  MENU: món lẻ (items) + combo (combos)
#  - id: mã duy nhất, viết thường không dấu, nối bằng "-"
#  - aliases: các cách khách hay gọi (có dấu / không dấu / tên tắt) -> giúp AI hiểu đúng
#  - taste: điểm vị 0..3  (cay, ngot, chua, dam = đậm đà/mặn, beo = béo/ngậy)
#  - style: nuoc (món nước) | kho (món khô) | uong (đồ uống) | trang_mieng | an_kem
#  - temp: nong | lanh        portion: lon (no bụng) | vua | nhe   (không dùng "no": YAML hiểu là false)
#  - contains: thành phần chính -> dùng để lọc khi khách "không ăn bò", "dị ứng tôm"...
#  - diet: [chay] nếu là món chay
#  - best_seller / boost: ưu tiên khi gợi ý (boost: -2..+2, quán muốn đẩy món nào thì tăng)
#  - pairs_with: món hay ăn kèm -> AI gợi ý thêm (upsell)
#  - options: tuỳ chọn (size...) có cộng tiền
# =====================================================================
categories:
  - { id: pho, name: "Phở", aliases: ["pho"] }
  - { id: bun, name: "Bún", aliases: ["bun"] }
  - { id: com, name: "Cơm", aliases: ["com"] }
  - { id: mon-nhe, name: "Món nhẹ & ăn kèm", aliases: ["ăn vặt", "món nhẹ", "ăn kèm", "khai vị"] }
  - { id: do-uong, name: "Đồ uống", aliases: ["nước uống", "thức uống", "đồ uống", "nước giải khát"] }
  - { id: trang-mieng, name: "Tráng miệng", aliases: ["tráng miệng", "chè", "đồ ngọt"] }

