[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aistaff"
version = "0.1.0"
description = "Nhân viên AI gọi món bằng giọng nói tiếng Việt cho quán ăn / kiosk / máy bán hàng (chạy offline trên edge device)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rapidfuzz>=3.6",
  "segno>=1.6",
  "tzdata>=2024.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "anthropic>=2.3",   # bộ não Claude (cloud); LLM local chỉ cần httpx
]

[project.optional-dependencies]
# Nhận dạng giọng nói (ASR) + VAD + TTS chạy offline
speech = [
  "numpy>=1.26",
  "sherpa-onnx>=1.12",
  "sentencepiece>=0.2",
  "piper-tts>=1.3",
]
# Chạy vòng lặp micro/loa trực tiếp trên thiết bị (không qua trình duyệt)
audio = ["sounddevice>=0.4.6", "numpy>=1.26"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
aistaff = "aistaff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aistaff = ["kiosk/static/*", "kiosk/webui/*", "kiosk/webui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
